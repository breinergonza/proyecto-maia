# Migraciones de la base maia. Uso (desde proyecto-codigo/):
#   uv run alembic -c plataforma/comun/alembic.ini upgrade head
# o, sin depender de la ruta del .ini:  python -m maia_comun.migraciones
[alembic]
script_location = maia_comun:alembic
# La URL sale de DATABASE_URL (ver maia_comun/config.py); no se escribe aquí.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
