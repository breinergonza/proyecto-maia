[project]
name = "maia-entrenamiento"
version = "0.1.0"
description = "CLI maia: extracción, entrenamiento con GPU, registro en MLflow, corrida semestral y paquetes"
requires-python = ">=3.13"
dependencies = [
    "maia-comun",
    "typer>=0.16",
    "mlflow>=3.4",
    "httpx>=0.28",
]

[project.scripts]
maia = "maia_entrenamiento.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maia_entrenamiento"]
