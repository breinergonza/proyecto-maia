[project]
name = "maia-nucleo"
version = "0.1.0"
description = "Núcleo del Observatorio Canguro: contrato SEVARTI, modelo de anomalías y alertas clínicas (copia de 4-Insumos-Proyecto/insumo-datos)"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3",
    "pandas>=3.0",
    "numpy>=2.5",
    "lightgbm==4.7.0",          # la misma versión en el trainer (CUDA) y en la API (CPU): los pickles dependen de ella
    "scipy>=1.15",
    "pyarrow>=20",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
informes = ["matplotlib>=3.11", "jupyter>=1.1", "nbformat>=5.10"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Los módulos conservan sus nombres originales: los modelos guardados (pickle) los referencian.
[tool.hatch.build.targets.wheel]
packages = ["sevarti", "anomalias", "clinico", "retroalimentacion", "archivos"]

[tool.hatch.build.targets.wheel.force-include]
"pipeline.py" = "pipeline.py"
