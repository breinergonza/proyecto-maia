[project]
name = "maia-comun"
version = "0.1.0"
description = "Piezas compartidas: configuración, base de datos, almacén MinIO, paquetes de modelos, puntuación y correo"
requires-python = ">=3.13"
dependencies = [
    "maia-nucleo",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.3",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "boto3>=1.40",
    "cryptography>=46",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maia_comun"]
