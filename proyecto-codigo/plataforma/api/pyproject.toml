[project]
name = "maia-api"
version = "0.1.0"
description = "API FastAPI del Observatorio: tablero, línea temporal por niño, revisión experta, inferencia y paquetes"
requires-python = ">=3.13"
dependencies = [
    "maia-comun",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maia_api"]
