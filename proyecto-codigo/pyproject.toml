# Raíz del workspace de uv. No tiene código propio: cada paquete vive en su carpeta.
#   uv sync --all-packages          instala todo (núcleo, común, entrenamiento, api) en .venv
#   uv run pytest                   corre las pruebas de todos los paquetes
[tool.uv.workspace]
members = ["nucleo", "plataforma/comun", "plataforma/entrenamiento", "plataforma/api"]

[tool.uv]
required-version = ">=0.11"

[tool.uv.sources]
maia-nucleo = { workspace = true }
maia-comun = { workspace = true }
maia-entrenamiento = { workspace = true }
maia-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "httpx>=0.28",
    "moto[server]>=5.1",
    "pytest-timeout>=2.3",
    "testcontainers[postgres]>=4.10",
    "aiosmtpd>=1.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["nucleo", "plataforma/web", "respaldos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["maia_comun", "maia_entrenamiento", "maia_api", "sevarti", "anomalias", "clinico",
                     "retroalimentacion", "archivos"]

[tool.pytest.ini_options]
testpaths = ["nucleo/pruebas", "plataforma/comun/pruebas", "plataforma/entrenamiento/pruebas",
             "plataforma/api/pruebas"]
addopts = "-q -p no:cacheprovider"
markers = [
    "gpu: necesita una GPU NVIDIA con LightGBM compilado con CUDA (se salta si no hay)",
    "integracion: usa Postgres real (MAIA_TEST_DATABASE_URL o binarios locales de Postgres)",
]
